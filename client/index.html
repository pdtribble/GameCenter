<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>GameCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050a05">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameCenter">
  <style>
    :root {
      --nav-height: 60px;
      --nav-bg: #0a0a0a;
      --nav-border: rgba(255,255,255,0.08);
      --nav-active: #39ff14;
      --nav-inactive: rgba(255,255,255,0.35);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      background: #050a05;
      -webkit-tap-highlight-color: transparent;
    }

    #bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      align-items: stretch;
      z-index: 1000;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    #bottom-nav.nav-hidden {
      display: none;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--nav-inactive);
      transition: color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }

    .nav-tab.active {
      color: var(--nav-active);
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    .nav-label {
      font-size: 8px;
      letter-spacing: 2px;
      font-family: 'DM Mono', 'Courier New', monospace;
      font-weight: bold;
      text-transform: uppercase;
    }

    .nav-tab.active .nav-label {
      text-shadow: 0 0 8px rgba(57,255,20,0.6);
    }
  </style>
</head>
<body>
  <!-- Announcement bar (hidden until needed) -->
  <div id="announcement-bar" class="announcement-bar" style="display:none"></div>

  <!-- Scaled app canvas -->
  <div id="app-root">
    <div id="app"></div>
  </div>

  <!-- Bottom navigation (outside scaled canvas, fixed to real viewport) -->
  <nav id="bottom-nav">
    <button class="nav-tab active" data-view="home">
      <span class="nav-icon">🎮</span>
      <span class="nav-label">MULTIPLAYER</span>
    </button>
    <button class="nav-tab" data-view="singleplayer">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">SINGLE PLAYER</span>
    </button>
    <button class="nav-tab" data-view="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">PROFILE</span>
    </button>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
