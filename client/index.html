<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GameCenter">
</head>
<body>
  <div id="app-root">
    <!-- Announcement bar (hidden until needed) -->
    <div id="announcement-bar" class="announcement-bar" style="display:none"></div>

    <!-- Nav -->
    <nav class="navbar" id="navbar">
      <div class="navbar-actions" style="gap:4px">
        <button class="btn btn-sm btn-primary" id="nav-tab-multi">🎮 Multiplayer</button>
        <button class="btn btn-sm btn-secondary" id="nav-tab-solo">💣 Solo</button>
      </div>
      <div style="flex:1"></div>
      <div class="navbar-actions">
        <button class="btn btn-sm btn-secondary" id="nav-theme-toggle" title="Toggle dark mode">🌙</button>
        <button class="btn btn-sm btn-secondary" id="nav-profile" style="display:none">👤 Profile</button>
      </div>
    </nav>

    <!-- Main app container — views render here -->
    <div id="app"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
